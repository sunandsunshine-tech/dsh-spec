name: checks

# The gate a pull request owes, and the same gate over main after a merge. The
# token is read-only: nothing here writes to the repository.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: the pinned workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: the shipped corpus
        env:
          # The notes archive baseline is the commit the change is offered against, not the change's
          # own tip: reading HEAD would trust a manifest the change itself rewrote.
          NOTES_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: pnpm run check:corpus

      - name: the source formatting
        run: pnpm run format:check

      - name: the shipped script bundles
        run: pnpm run skill:verify-bundles

      - name: the functional suite
        run: pnpm test

      # `github.sha` on a pull_request is the merge commit GitHub creates, whose author is whoever
      # pushed and which carries no sign-off, so the range would name a commit the change never
      # wrote. The branch's own tip is the thing a contributor signed.
      #
      # A commit claiming a bot identity is verified against GitHub as well, which is why this step
      # carries a token: `gh` reads `GITHUB_TOKEN` and refuses without it, and a refusal is not a
      # pass. `contents: read` is the only scope it needs, and a range of human commits never asks.
      - name: the Developer Certificate of Origin
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-dco.ts --base="origin/${{ github.base_ref }}" --head="${{ github.event.pull_request.head.sha }}"
