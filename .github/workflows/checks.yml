name: checks

# The gate a pull request owes, and the same gate over main after a merge. The
# token is read-only: nothing here writes to the repository.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0

      # The provenance gate resolves each ported file's origin revision inside
      # the baseline's history, and a shallow clone does not carry it.
      - name: the baseline carries the history the gate reads
        run: |
          if [ "$(git -C submodules/dsh rev-parse --is-shallow-repository)" = "true" ]; then
            git -C submodules/dsh fetch --unshallow --tags origin
          else
            git -C submodules/dsh fetch --tags origin
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: the functional suite
        run: node --test 'tests/**/*.test.ts'

      - name: the note tree and the frozen archive
        run: node .agents/skills/dsh-spec-manager/scripts/dsh-spec.ts check --all --root .

      - name: port provenance
        run: node scripts/verify-port-provenance.ts

      - name: skill structure, once per skill directory
        run: |
          for dir in skills/*/; do
            node scripts/verify-skill-structure.ts --root "$dir"
          done

      - name: the Developer Certificate of Origin
        if: github.event_name == 'pull_request'
        run: node scripts/verify-dco.ts --base="origin/${{ github.base_ref }}" --head="${{ github.sha }}"
