<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings</title>
    <link rel="stylesheet" href="./src/settings.css" />
  </head>
  <body>
    <main class="settings-page">
      <h1>Settings</h1>
      <section class="settings-card" aria-labelledby="account-settings">
        <h2 id="account-settings">Account settings</h2>
        <div>
          <strong>Notification email</strong>
          <p>Receive release notes and account alerts.</p>
        </div>
        <button type="button">Change email</button>
        <div>
          <strong>Password</strong>
          <p>Use a unique password for this account.</p>
        </div>
        <button type="button">Update password</button>
      </section>
    </main>
  </body>
</html>
